<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8ecea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d141a" />
    <meta name="robots" content="noindex" />
    <title>Cocon – diagnostic</title>
    <link rel="preload" href="/assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/diagnostic.css" />
  </head>
  <body>
    <!-- L'écran de connexion est ajouté ici par session.js. -->

    <div id="report-view" hidden>
      <header class="topbar">
        <div class="topbar__inner">
          <a class="brand" href="/">Cocon</a>
          <span class="muted">Diagnostic</span>
          <span class="spacer"></span>
          <span id="who" class="badge"></span>
        </div>
      </header>

      <main class="page stack">
        <p id="report-error" class="notice notice--error" role="alert" hidden></p>
        <div id="loading" class="loading" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Lecture de votre installation…</span>
        </div>

        <div id="report" class="stack" hidden></div>

        <div class="actions">
          <button id="copy-report" class="button button--primary" type="button" disabled>
            Copier le rapport
          </button>
          <button id="refresh" class="button" type="button">Actualiser</button>
        </div>
        <p id="copy-status" class="small muted" aria-live="polite"></p>
        <textarea id="report-text" class="report" readonly hidden></textarea>

        <button id="signout" class="button button--quiet" type="button">Se déconnecter</button>
      </main>
    </div>

    <script type="module" src="/assets/diagnostic.js"></script>
  </body>
</html>
