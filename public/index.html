<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8ecea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d141a" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Cocon" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Cocon</title>
    <link rel="preload" href="/assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <!-- L'écran de connexion est ajouté ici par session.js. -->

    <div id="app" class="scene" data-mode="off" hidden>
      <!-- Niveau coloré : il monte avec la consigne ; la vague va plus vite quand l'unité souffle fort. -->
      <div id="level" class="level" aria-hidden="true">
        <svg id="wave" class="wave" viewBox="0 0 780 28" preserveAspectRatio="none" focusable="false">
          <path d="M0 14 Q 97.5 0 195 14 T 390 14 T 585 14 T 780 14 V 28 H 0 Z" />
        </svg>
      </div>

      <div class="scene__inner">
        <header class="bar">
          <h1 class="visually-hidden">Cocon</h1>
          <div id="tabs" class="tabs" role="group" aria-label="Pièce"></div>
          <button id="open-absence-top" class="tool" type="button" aria-label="Absence de toute la maison"></button>
          <button id="power" class="tool tool--round" type="button" aria-label="Éteindre"></button>
          <button id="open-more" class="tool" type="button" aria-label="Plus d'options"></button>
        </header>

        <p id="banner" class="banner" role="alert" hidden></p>

        <button id="ribbon" class="ribbon" type="button" hidden>
          <span id="ribbon-icon" class="ribbon__icon" aria-hidden="true"></span>
          <span id="ribbon-text" class="ribbon__text"></span>
        </button>

        <main id="room" class="room">
          <div id="loading" class="loading-rooms">
            <span class="spinner" aria-hidden="true"></span>
            <span>Lecture de vos climatiseurs…</span>
          </div>

          <div id="empty" class="empty stack" hidden>
            <p>Aucune pièce climatisée n'a été trouvée sur ce compte Cozytouch.</p>
            <a class="button" href="/diagnostic">Ouvrir le diagnostic</a>
          </div>

          <!-- Surface de réglage : glisser vers le haut ou le bas règle la consigne, de côté change de pièce. -->
          <div id="dial" class="dial" hidden>
            <div id="dial-content" class="dial__content">
              <p id="dial-state" class="dial__state"></p>
              <p id="dial-number" class="dial__number" aria-hidden="true">
                <span id="dial-whole" class="dial__whole"></span>
                <span class="dial__side">
                  <span class="dial__degree">°</span>
                  <span id="dial-decimal" class="dial__decimal"></span>
                </span>
              </p>
              <p id="dial-measured" class="dial__measured"></p>
              <p id="dial-hint" class="dial__hint"></p>
            </div>
            <!-- Pour VoiceOver et le clavier : le même réglage, sous forme de curseur natif. -->
            <label class="visually-hidden" for="setpoint">Consigne</label>
            <input id="setpoint" class="visually-hidden" type="range" min="16" max="30" step="0.5" />
          </div>

          <div id="room-status" class="room__status" hidden>
            <p id="status-line" class="room__line"></p>
            <p id="conflict-line" class="room__conflict" hidden></p>
            <p id="send-line" class="room__send" aria-live="polite"></p>
          </div>

          <div id="tiles" class="tiles" hidden></div>
        </main>
      </div>
    </div>

    <!-- Réglages d'une pièce (mode, vitesse, volets, options, programme) : rempli par app.js -->
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>

    <!-- Absence (toute la maison) : rempli par app.js -->
    <dialog id="absence" class="sheet" aria-labelledby="absence-title"></dialog>

    <!-- Options du compte -->
    <dialog id="more" class="sheet sheet--small" aria-labelledby="more-title">
      <div class="sheet__grab" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 id="more-title">Cocon</h2>
        <span class="spacer"></span>
        <button class="button button--quiet" type="button" data-close>Fermer</button>
      </div>
      <div class="sheet__body">
        <p id="who" class="muted"></p>
        <button id="refresh" class="button" type="button">Actualiser maintenant</button>
        <a class="button" href="/diagnostic">Ouvrir le diagnostic</a>
        <button id="signout" class="button" type="button">Se déconnecter</button>
      </div>
    </dialog>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
